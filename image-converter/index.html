<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP图片转换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .sponsor-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.3);
        }
        
        .sponsor-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(245, 87, 108, 0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            line-height: 1;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .sponsor-form {
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .payment-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .payment-method {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 14px;
            background: white;
        }
        
        .payment-method:hover {
            border-color: #667eea;
        }
        
        .payment-method.active {
            border-color: #667eea;
            background: #f0f2ff;
            color: #667eea;
            font-weight: 600;
        }
        
        .notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #856404;
            text-align: center;
            font-size: 14px;
        }
        
        .qrcode-container {
            display: none;
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .qrcode-container.show {
            display: block;
        }
        
        .qrcode-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        
        .qrcode-image {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }
        
        .qrcode-hint {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
        
        .show-qrcode-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            transition: transform 0.2s;
        }
        
        .show-qrcode-btn:hover {
            transform: translateY(-2px);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }
        
        .upload-area.dragging {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            font-size: 14px;
            color: #999;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-list {
            margin-top: 30px;
        }
        
        .file-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .file-info {
            flex: 1;
        }
        
        .file-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }
        
        .file-status {
            font-size: 12px;
            color: #666;
        }
        
        .file-status.success {
            color: #28a745;
        }
        
        .file-status.error {
            color: #dc3545;
        }
        
        .file-status.processing {
            color: #007bff;
        }
        
        .download-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .download-btn:hover {
            background: #218838;
        }
        
        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: background 0.3s;
        }
        
        .remove-btn:hover {
            background: #c82333;
        }
        
        .convert-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        .convert-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="sponsor-btn" id="sponsorBtn">❤️ 赞助支持</button>
        
        <h1>📸 UP图片转换工具</h1>
        <p class="subtitle">支持 HEIC、PNG、JPG 等多种格式,自动转换为 JPG 格式</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽文件到此处上传</div>
            <div class="upload-hint">支持多张图片同时上传</div>
            <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple>
        </div>
        
        <button class="convert-btn" id="convertBtn" disabled>开始转换</button>
        
        <div class="file-list" id="fileList"></div>
    </div>

    <!-- 赞助支持弹窗 -->
    <div class="modal" id="sponsorModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2 class="modal-title">❤️ 赞助支持</h2>
            
            <div class="sponsor-form">
                <div class="form-group">
                    <label class="form-label">赞助金额（元）</label>
                    <input type="number" class="form-input" id="amountInput" placeholder="请输入金额" min="1" value="10">
                </div>
                
                <div class="form-group">
                    <label class="form-label">选择支付方式</label>
                    <div class="payment-methods">
                        <button class="payment-method active" data-method="alipay">
                            支付宝
                        </button>
                        <button class="payment-method" data-method="wechat">
                            微信支付
                        </button>
                    </div>
                </div>
                
                <div class="notice">
                    ⚠️ 暂不支持直接支付，请手动转账
                </div>
                
                <button class="show-qrcode-btn" id="showQrcodeBtn">显示收款码</button>
            </div>
            
            <div class="qrcode-container" id="qrcodeContainer">
                <div class="qrcode-title" id="qrcodeTitle">支付宝收款码</div>
                <div class="qrcode-image" id="qrcodeImage">
                    请替换为实际收款码<br>
                    图片路径: qrcode-alipay.png
                </div>
                <div class="qrcode-hint">请使用<span id="paymentName">支付宝</span>扫描二维码转账</div>
            </div>
        </div>
    </div>

    <script>
        // 自动检测基础路径配置
        let currentPath = window.location.pathname;
        
        // 如果路径以 .html 结尾，移除文件名
        if (currentPath.endsWith('.html')) {
            currentPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
        }
        
        // 移除末尾的斜杠
        let basePath = currentPath.endsWith('/') && currentPath.length > 1
            ? currentPath.slice(0, -1)
            : currentPath;
        
        // 如果是根路径，设为空字符串
        if (basePath === '/') {
            basePath = '';
        }
        
        const getUrl = (path) => {
            // 确保 path 不以斜杠开头
            const cleanPath = path.startsWith('/') ? path.substring(1) : path;
            return basePath ? basePath + '/' + cleanPath : '/' + cleanPath;
        };
        
        console.log('Current Path:', window.location.pathname);
        console.log('Base Path:', basePath);
        console.log('Upload API:', getUrl('upload.php'));
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const convertBtn = document.getElementById('convertBtn');
        let selectedFiles = [];
        
        // 赞助相关元素
        const sponsorBtn = document.getElementById('sponsorBtn');
        const sponsorModal = document.getElementById('sponsorModal');
        const closeModal = document.getElementById('closeModal');
        const paymentMethods = document.querySelectorAll('.payment-method');
        const showQrcodeBtn = document.getElementById('showQrcodeBtn');
        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const qrcodeTitle = document.getElementById('qrcodeTitle');
        const qrcodeImage = document.getElementById('qrcodeImage');
        const paymentName = document.getElementById('paymentName');
        const amountInput = document.getElementById('amountInput');
        let selectedPaymentMethod = 'alipay';

        // 打开赞助弹窗
        sponsorBtn.addEventListener('click', () => {
            sponsorModal.classList.add('show');
            qrcodeContainer.classList.remove('show');
        });

        // 关闭弹窗
        closeModal.addEventListener('click', () => {
            sponsorModal.classList.remove('show');
        });

        // 点击背景关闭弹窗
        sponsorModal.addEventListener('click', (e) => {
            if (e.target === sponsorModal) {
                sponsorModal.classList.remove('show');
            }
        });

        // 选择支付方式
        paymentMethods.forEach(method => {
            method.addEventListener('click', () => {
                paymentMethods.forEach(m => m.classList.remove('active'));
                method.classList.add('active');
                selectedPaymentMethod = method.dataset.method;
                qrcodeContainer.classList.remove('show');
            });
        });

        // 显示收款码
        showQrcodeBtn.addEventListener('click', () => {
            const amount = amountInput.value || '10';
            
            if (selectedPaymentMethod === 'alipay') {
                qrcodeTitle.textContent = '支付宝收款码';
                paymentName.textContent = '支付宝';
                // qrcodeImage.innerHTML = `请替换为实际收款码<br>图片路径: qrcode-alipay.png<br>金额: ¥${amount}`;
                // 如果有实际的二维码图片，可以这样使用：
                qrcodeImage.innerHTML = `<img src="${getUrl('qrcode-alipay.png')}" style="width: 100%; height: 100%; object-fit: contain;" alt="支付宝收款码">`;
            } else {
                qrcodeTitle.textContent = '微信收款码';
                paymentName.textContent = '微信';
                // qrcodeImage.innerHTML = `请替换为实际收款码<br>图片路径: qrcode-wechat.png<br>金额: ¥${amount}`;
                // 如果有实际的二维码图片，可以这样使用：
                qrcodeImage.innerHTML = `<img src="${getUrl('qrcode-wechat.png')}" style="width: 100%; height: 100%; object-fit: contain;" alt="微信收款码">`;
            }
            
            qrcodeContainer.classList.add('show');
        });

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            handleFiles(e.dataTransfer.files);
        });

        // 处理文件
        function handleFiles(files) {
            for (let file of files) {
                if (file.type.startsWith('image/') || file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif')) {
                    selectedFiles.push({
                        file: file,
                        id: Date.now() + Math.random(),
                        status: 'pending'
                    });
                }
            }
            updateFileList();
            convertBtn.disabled = selectedFiles.length === 0;
        }

        // 更新文件列表
        function updateFileList() {
            fileList.innerHTML = '';
            selectedFiles.forEach((fileObj, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                const fileInfo = document.createElement('div');
                fileInfo.className = 'file-info';
                
                const fileName = document.createElement('div');
                fileName.className = 'file-name';
                fileName.textContent = fileObj.file.name;
                
                const fileStatus = document.createElement('div');
                fileStatus.className = 'file-status';
                fileStatus.id = `status-${fileObj.id}`;
                
                if (fileObj.status === 'pending') {
                    fileStatus.textContent = '等待转换...';
                } else if (fileObj.status === 'processing') {
                    fileStatus.className += ' processing';
                    fileStatus.textContent = '转换中...';
                } else if (fileObj.status === 'success') {
                    fileStatus.className += ' success';
                    fileStatus.textContent = '✓ 转换成功';
                } else if (fileObj.status === 'error') {
                    fileStatus.className += ' error';
                    fileStatus.textContent = '✗ 转换失败';
                }
                
                fileInfo.appendChild(fileName);
                fileInfo.appendChild(fileStatus);
                
                const actions = document.createElement('div');
                
                if (fileObj.downloadUrl) {
                    const downloadBtn = document.createElement('a');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.textContent = '📥 下载';
                    downloadBtn.href = fileObj.downloadUrl;
                    downloadBtn.download = fileObj.convertedFileName || 'converted.jpg';
                    actions.appendChild(downloadBtn);
                }
                
                if (fileObj.status === 'pending') {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-btn';
                    removeBtn.textContent = '移除';
                    removeBtn.onclick = () => removeFile(fileObj.id);
                    actions.appendChild(removeBtn);
                }
                
                fileItem.appendChild(fileInfo);
                fileItem.appendChild(actions);
                fileList.appendChild(fileItem);
            });
        }

        // 移除文件
        function removeFile(id) {
            selectedFiles = selectedFiles.filter(f => f.id !== id);
            updateFileList();
            convertBtn.disabled = selectedFiles.length === 0;
        }

        // 转换按钮
        convertBtn.addEventListener('click', async () => {
            convertBtn.disabled = true;
            
            for (let fileObj of selectedFiles) {
                if (fileObj.status !== 'pending') continue;
                
                fileObj.status = 'processing';
                updateFileList();
                
                const formData = new FormData();
                formData.append('image', fileObj.file);
                
                try {
                    const response = await fetch(getUrl('upload.php'), {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        fileObj.status = 'success';
                        fileObj.downloadUrl = result.data.downloadUrl;
                        fileObj.convertedFileName = result.data.convertedFile;
                    } else {
                        fileObj.status = 'error';
                        console.error(result.error);
                    }
                } catch (error) {
                    fileObj.status = 'error';
                    console.error('Upload error:', error);
                }
                
                updateFileList();
            }
            
            // 检查是否还有待处理的文件
            const hasPending = selectedFiles.some(f => f.status === 'pending');
            convertBtn.disabled = !hasPending;
        });
    </script>
</body>
</html>
